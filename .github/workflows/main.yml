name: Build Flick Demon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Package Config
        run: |
          # Create a package.json if it doesn't exist to satisfy npm/Capacitor setup
          if [ ! -f package.json ]; then
            npm init -y
          fi
          
          # Create dist folder and move index.html into it for Capacitor web-dir
          mkdir -p dist
          if [ -f index.html ]; then
            cp index.html dist/index.html
          else
            echo "Error: index.html not found in root directory!"
            exit 1
          fi

      - name: Install Capacitor & Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Project
        run: |
          npx cap init "flick demon" "com.flickdemon.app" --web-dir=dist --yes

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Apply Gradle Fixes for Kotlin Conflict
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Sync Web Assets into Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickDemon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
